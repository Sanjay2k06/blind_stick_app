name: Veyra Android CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veyra-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Veyra APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Build Environment
        run: |
          echo "=== Flutter Version ==="
          flutter --version
          echo "=== Java Version ==="
          java -version

      - name: Install Dependencies
        working-directory: naveye
        run: flutter pub get

      - name: Run Test Suite
        working-directory: naveye
        run: flutter test

      - name: Build Release APK
        working-directory: naveye
        run: flutter build apk --release

      - name: Validate & Prepare Release APK
        run: |
          APK_SOURCE="naveye/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Release APK not found at $APK_SOURCE"
            exit 1
          fi

          FILE_SIZE=$(wc -c < "$APK_SOURCE" | tr -d ' ')
          echo "Built APK size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 10000000 ]; then
            echo "::error::Built APK is suspiciously small ($FILE_SIZE bytes). Build may be corrupted."
            exit 1
          fi

          # Verify archive integrity
          unzip -t "$APK_SOURCE" AndroidManifest.xml >/dev/null 2>&1 || {
            echo "::error::Built file is not a valid Android APK archive."
            exit 1
          }

          # Prepare exact asset filename for release
          cp "$APK_SOURCE" Veyra.apk
          echo "Veyra.apk successfully prepared and validated."

      - name: Determine Version & Collision-Safe Tag
        id: release_meta
        run: |
          VERSION=$(grep '^version:' naveye/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD_CODE=$(grep '^version:' naveye/pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)
          TAG_NAME="v${VERSION}-build.${GITHUB_RUN_NUMBER}"

          # Check if tag already exists in remote
          if git ls-remote --tags origin "$TAG_NAME" | grep -q "$TAG_NAME"; then
            TAG_NAME="v${VERSION}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_code=${BUILD_CODE}" >> "$GITHUB_OUTPUT"
          echo "Target tag: ${TAG_NAME} for version ${VERSION}"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          VERSION: ${{ steps.release_meta.outputs.app_version }}
          RUN_NUM: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          RELEASE_TITLE="Veyra v${VERSION} (Build ${RUN_NUM})"
          
          cat << 'EOF' > release_notes.md
          ## Veyra Android Release

          Automated production build generated by GitHub Actions CI/CD.

          ### Build Information
          - **Version**: `v${VERSION}`
          - **Build Run**: `${RUN_NUM}`
          - **Commit**: `${COMMIT_SHA}`
          - **Asset**: `Veyra.apk`

          ### Download & Installation
          Download **`Veyra.apk`** below or use the permanent stable URL:
          `https://github.com/Sanjay2k06/blind_stick_app/releases/latest/download/Veyra.apk`
          EOF

          # Substitute variables into release notes
          sed -i "s/\${VERSION}/${VERSION}/g" release_notes.md
          sed -i "s/\${RUN_NUM}/${RUN_NUM}/g" release_notes.md
          sed -i "s/\${COMMIT_SHA}/${COMMIT_SHA}/g" release_notes.md

          echo "Creating release $TAG_NAME with asset Veyra.apk..."
          gh release create "$TAG_NAME" Veyra.apk \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --latest

          echo "Release $TAG_NAME published successfully with Veyra.apk marked as latest!"
